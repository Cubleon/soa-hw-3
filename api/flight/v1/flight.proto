syntax = "proto3";

package flight.v1;
option go_package = "flightbooking/gen/flight/v1;flightv1";

import "google/protobuf/timestamp.proto";

// Every RPC requires x-api-key metadata. Missing/invalid credentials:
// UNAUTHENTICATED. Malformed input: INVALID_ARGUMENT. Storage failure: INTERNAL.
service FlightService {
  rpc SearchFlights(SearchFlightsRequest) returns (SearchFlightsResponse);
  // NOT_FOUND if the flight does not exist.
  rpc GetFlight(GetFlightRequest) returns (Flight);
  // Idempotent by booking_id and identical parameters. NOT_FOUND for a missing
  // flight; RESOURCE_EXHAUSTED for insufficient seats; FAILED_PRECONDITION for
  // a closed flight/released booking; ALREADY_EXISTS for conflicting parameters.
  rpc ReserveSeats(ReserveSeatsRequest) returns (SeatReservation);
  // Idempotent, including release-before-reserve (a cancellation fence is saved).
  rpc ReleaseReservation(ReleaseReservationRequest) returns (ReleaseReservationResponse);
  // Administrative RPC, protected by the same service credential.
  // NOT_FOUND for a missing flight; FAILED_PRECONDITION for invalid status changes.
  rpc UpdateFlight(UpdateFlightRequest) returns (Flight);
}

enum FlightStatus {
  FLIGHT_STATUS_UNSPECIFIED = 0;
  SCHEDULED = 1;
  DEPARTED = 2;
  CANCELLED = 3;
  COMPLETED = 4;
}

enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  RELEASED = 2;
  EXPIRED = 3;
}

message Flight {
  string id = 1;
  string flight_number = 2;
  string airline_code = 3;
  string airline_name = 4;
  string origin = 5;
  string destination = 6;
  google.protobuf.Timestamp departure_at = 7;
  google.protobuf.Timestamp arrival_at = 8;
  int32 total_seats = 9;
  int32 available_seats = 10;
  // Integer minor units (kopecks), RUB. No floating point money.
  int64 price_minor = 11;
  string currency = 12;
  FlightStatus status = 13;
}

message SeatReservation {
  string booking_id = 1;
  string flight_id = 2;
  int32 seat_count = 3;
  ReservationStatus status = 4;
  google.protobuf.Timestamp created_at = 5;
}

message SearchFlightsRequest {
  string origin = 1;
  string destination = 2;
  // Optional UTC calendar day (00:00:00 UTC); not a local timezone date.
  google.protobuf.Timestamp departure_date = 3;
}
message SearchFlightsResponse { repeated Flight flights = 1; }
message GetFlightRequest { string id = 1; }
message ReserveSeatsRequest {
  string flight_id = 1;
  int32 seat_count = 2;
  string booking_id = 3;
}
message ReleaseReservationRequest { string booking_id = 1; }
message ReleaseReservationResponse {
  // False if already released or a cancellation fence was created.
  bool released = 1;
}
message UpdateFlightRequest {
  string id = 1;
  // Both fields are required. Capacity and route are immutable via this RPC.
  int64 price_minor = 2;
  FlightStatus status = 3;
}
